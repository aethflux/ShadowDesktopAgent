<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data: http://127.0.0.1:8787; connect-src 'self' http://127.0.0.1:8787;" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadow Agent Console</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <main class="app">

      <!-- Permission request dialog — surfaced by the broker when the agent
           wants to access a directory outside the workspace. ``hidden`` is
           toggled from JS once a `permission_request` SSE event arrives. -->
      <div class="modal-backdrop permission-backdrop" id="permissionBackdrop" hidden>
        <div class="modal permission-modal" role="alertdialog" aria-labelledby="permissionTitle" aria-modal="true">
          <header class="modal-head">
            <h2 id="permissionTitle">Shadow 想访问你工作区外的目录</h2>
          </header>
          <div class="permission-body">
            <p class="permission-reason" id="permissionReason"></p>
            <div class="permission-path-wrap">
              <span class="permission-path-label">路径</span>
              <code class="permission-path" id="permissionPath"></code>
            </div>
            <p class="permission-tip" id="permissionTip">如果这是你信任的目录，可以选择允许；否则建议拒绝。</p>
            <p class="permission-countdown" id="permissionCountdown" aria-live="polite"></p>
          </div>
          <footer class="modal-foot permission-foot">
            <button class="ghost permission-deny" id="permissionDeny">拒绝</button>
            <button class="ghost permission-once" id="permissionOnce">仅本次</button>
            <button class="ghost permission-session" id="permissionSession">本会话允许</button>
            <button class="permission-always" id="permissionAlways">永久允许</button>
          </footer>
        </div>
      </div>

      <!-- Settings modal — opened by the gear icon or via "Settings…" in the
           pet's right-click menu. Hidden by default; CSS handles the fade. -->
      <div class="modal-backdrop" id="settingsBackdrop" hidden>
        <div class="modal" role="dialog" aria-labelledby="settingsTitle" aria-modal="true">
          <header class="modal-head">
            <h2 id="settingsTitle">设置</h2>
            <button class="ghost compact" id="settingsClose" aria-label="关闭">✕</button>
          </header>
          <nav class="settings-tabs" id="settingsTabs">
            <button data-tab="general" class="active">模型</button>
            <button data-tab="pet">桌宠</button>
            <button data-tab="persona">性格</button>
            <button data-tab="voice">语音</button>
            <button data-tab="memory">记忆 · 行为</button>
            <button data-tab="permissions">目录权限</button>
            <button data-tab="about">关于</button>
          </nav>
          <div class="settings-body" id="settingsBody"></div>
          <footer class="modal-foot">
            <span class="settings-status" id="settingsStatus" aria-live="polite"></span>
            <button class="ghost" id="settingsRefresh">重新加载</button>
            <button id="settingsSave">保存</button>
          </footer>
        </div>
      </div>

      <div class="workspace" id="workspace">
        <!-- LEFT RAIL — 会话 · 常用工具 · 设置 -->
        <aside class="rail">
          <div class="rail-brand">
            <span class="rail-logo" aria-hidden="true">🌙</span>
            <div class="rail-brand-text">
              <h1>Shadow</h1>
              <span class="rail-tagline">
                <span id="readyDot" class="ready-dot" title="Backend status"></span>
                控制台
              </span>
            </div>
          </div>

          <div class="rail-section rail-sessions">
            <div class="section-head">
              <h2>会话</h2>
              <button id="newSessionBtn" class="ghost compact" title="新建会话">+</button>
            </div>
            <div id="sessionList" class="session-list"></div>
          </div>

          <details class="rail-collapse" id="toolsCollapse">
            <summary class="rail-collapse-head">
              <span>运行状态</span>
              <span class="rail-chevron" aria-hidden="true">▾</span>
            </summary>
            <div id="capabilities" class="capabilities"></div>
          </details>

          <div class="rail-foot">
            <button id="settingsBtn" class="ghost rail-foot-btn" title="设置">⚙ 设置</button>
          </div>
        </aside>

        <!-- CENTER — 对话主体 -->
        <section class="chat">
          <header class="chat-head">
            <div class="chat-head-main">
              <button id="railToggle" class="ghost compact" title="显示 / 隐藏会话栏" aria-label="显示或隐藏会话栏">☰</button>
              <h2 id="chatTitle">对话</h2>
              <span id="taskStatus" class="status-pill">Idle</span>
            </div>
            <button id="traceToggle" class="ghost compact" title="显示 / 隐藏运行详情" aria-label="显示或隐藏运行详情">◧</button>
          </header>

          <div id="chatLog" class="chat-log"></div>

          <form class="composer" id="composer">
            <div id="attachPreview" class="attach-preview" hidden></div>
            <textarea id="message" placeholder="输入消息，或直接粘贴 / 拖入图片…"></textarea>
            <div class="composer-row">
              <div class="composer-tools">
                <input id="imageInput" type="file" accept="image/*" multiple hidden />
                <button type="button" id="attachBtn" class="composer-icon" title="添加图片" aria-label="添加图片">📎</button>
              </div>
              <div class="composer-buttons">
                <button type="submit">发送</button>
              </div>
            </div>
          </form>
        </section>

        <!-- RIGHT — agent trace -->
        <aside class="trace" id="tracePanel">
          <header class="trace-head">
            <h2>运行详情</h2>
          </header>
          <div class="trace-body">
            <div id="taskContent" class="task-content">
              <p class="empty">等待你的第一个任务。</p>
            </div>

            <details class="trace-collapse" id="timelineSection">
              <summary class="trace-collapse-head">
                <span>工具调用</span>
                <span class="trace-count" id="timelineCount"></span>
                <span class="rail-chevron" aria-hidden="true">▾</span>
              </summary>
              <div id="timeline" class="timeline-list">
                <p class="empty">工具调用会显示在这里。</p>
              </div>
            </details>

            <details class="trace-collapse" id="artifactsSection">
              <summary class="trace-collapse-head">
                <span>产物</span>
                <span class="trace-count" id="artifactsCount"></span>
                <span class="rail-chevron" aria-hidden="true">▾</span>
              </summary>
              <div id="artifacts" class="artifact-list">
                <p class="empty">截图和产物会显示在这里。</p>
              </div>
            </details>
          </div>
        </aside>
      </div>
    </main>
    <script src="./panel.js"></script>
  </body>
</html>
