<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data: http://127.0.0.1:8787; connect-src 'self' http://127.0.0.1:8787;" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoshino Agent Console</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>Hoshino 控制台</h1>
          <p class="sub">对话、截图、工具调用和运行状态集中在这里。</p>
        </div>
        <div class="topbar-actions">
          <span id="readyDot" class="ready-dot" title="Backend status"></span>
          <button id="voiceBtn" class="ghost">语音输入</button>
          <button id="settingsBtn" class="ghost compact" title="设置" aria-label="设置">⚙</button>
        </div>
      </header>

      <!-- Settings modal — opened by the gear icon or via "Settings…" in the
           pet's right-click menu. Hidden by default; CSS handles the fade. -->
      <div class="modal-backdrop" id="settingsBackdrop" hidden>
        <div class="modal" role="dialog" aria-labelledby="settingsTitle" aria-modal="true">
          <header class="modal-head">
            <h2 id="settingsTitle">设置</h2>
            <button class="ghost compact" id="settingsClose" aria-label="关闭">✕</button>
          </header>
          <nav class="settings-tabs" id="settingsTabs">
            <button data-tab="general" class="active">对话与模型</button>
            <button data-tab="pet">桌宠</button>
            <button data-tab="voice">语音</button>
            <button data-tab="memory">记忆 · 行为</button>
            <button data-tab="about">关于</button>
          </nav>
          <div class="settings-body" id="settingsBody"></div>
          <footer class="modal-foot">
            <span class="settings-status" id="settingsStatus" aria-live="polite"></span>
            <button class="ghost" id="settingsRefresh">重新加载</button>
            <button id="settingsSave">保存</button>
          </footer>
        </div>
      </div>

      <section class="status-strip" id="capabilities"></section>

      <section class="workspace-grid">
        <aside class="sessions panel">
          <div class="section-head">
            <h2>会话</h2>
            <button id="newSessionBtn" class="ghost compact" title="新建会话">+</button>
          </div>
          <div id="sessionList" class="session-list"></div>
        </aside>

        <section class="chat panel">
          <div class="section-head">
            <h2 id="chatTitle">对话</h2>
            <span id="taskStatus" class="status-pill">Idle</span>
          </div>
          <div id="chatLog" class="chat-log"></div>

          <form class="composer" id="composer">
            <textarea id="message" placeholder="输入消息，例如：看看当前屏幕，帮我判断哪里出了问题"></textarea>
            <div class="composer-row">
              <input id="imageInput" type="file" accept="image/*" />
              <div class="composer-buttons">
                <label class="streaming-toggle">
                  <input type="checkbox" id="streamingToggle" checked />
                  <span>流式</span>
                </label>
                <button type="submit">发送</button>
              </div>
            </div>
          </form>
        </section>

        <aside class="sidebar">
          <section class="panel" id="taskPanel">
            <h2>运行详情</h2>
            <div id="taskContent" class="task-content">
              <p class="empty">等待你的第一个任务。</p>
            </div>
          </section>

          <section class="panel">
            <h2>工具调用</h2>
            <div id="timeline" class="timeline-list">
              <p class="empty">工具调用会显示在这里。</p>
            </div>
          </section>

          <section class="panel">
            <h2>产物</h2>
            <div id="artifacts" class="artifact-list">
              <p class="empty">截图和产物会显示在这里。</p>
            </div>
          </section>
        </aside>
      </section>
    </main>
    <script src="./panel.js"></script>
  </body>
</html>
