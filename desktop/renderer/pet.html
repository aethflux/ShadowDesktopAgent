<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'; media-src 'self' http://127.0.0.1:8787 http://localhost:8787 data: blob:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadow Pet</title>
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <div class="pet-shell avatar-streamer" id="petShell" data-state="idle">
      <div class="aura"></div>
      <div class="watch-dot" id="watchDot" title="持续陪伴状态"></div>
      <div class="pet-bubble" id="petBubble">右键开启持续陪伴，双击也可以切换。</div>

      <!-- State expression overlays -->
      <div class="state-fx" aria-hidden="true">
        <div class="thought">
          <span class="t-dot d1"></span>
          <span class="t-dot d2"></span>
          <span class="t-dot d3"></span>
        </div>
        <div class="sweat"></div>
        <div class="sparkle s1"></div>
        <div class="sparkle s2"></div>
        <div class="sparkle s3"></div>
        <div class="sparkle s4"></div>
        <div class="sound-waves">
          <span></span><span></span><span></span>
        </div>
        <div class="heart h1"></div>
        <div class="heart h2"></div>
      </div>

      <!-- CSS-only avatar — pointer-events:none so the shell receives clicks -->
      <div class="avatar" id="petBody" aria-label="Shadow digital companion" style="pointer-events:none;">
        <div class="ahoge"></div>
        <div class="hair hair-back"></div>
        <div class="side-lock left">
          <div class="lock-tip"></div>
        </div>
        <div class="side-lock right">
          <div class="lock-tip"></div>
        </div>
        <div class="body">
          <div class="cape"></div>
          <div class="torso">
            <div class="sailor-collar">
              <div class="collar-stripe"></div>
              <div class="collar-stripe two"></div>
            </div>
            <div class="ribbon">
              <div class="ribbon-wing left"></div>
              <div class="ribbon-wing right"></div>
              <div class="ribbon-knot"></div>
              <div class="ribbon-tail left"></div>
              <div class="ribbon-tail right"></div>
            </div>
            <div class="chest-line"></div>
            <div class="skirt">
              <div class="skirt-frill"></div>
            </div>
          </div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="rapier"></div>
        </div>
        <div class="head">
          <div class="face">
            <div class="blush left"></div>
            <div class="blush right"></div>
            <div class="eye left">
              <div class="iris"></div>
              <div class="pupil"></div>
              <div class="hl big"></div>
              <div class="hl small"></div>
            </div>
            <div class="eye right">
              <div class="iris"></div>
              <div class="pupil"></div>
              <div class="hl big"></div>
              <div class="hl small"></div>
            </div>
            <div class="mouth" id="mouth"></div>
          </div>
          <div class="bangs">
            <div class="bang center"></div>
            <div class="bang side-left"></div>
            <div class="bang side-right"></div>
          </div>
          <div class="hair-clip"></div>
          <div class="headset"></div>
          <div class="mic"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./pet.js"></script>
  </body>
</html>
