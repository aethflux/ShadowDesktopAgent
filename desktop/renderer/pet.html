<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'; img-src 'self' http://127.0.0.1:8787 http://localhost:8787 data:; media-src 'self' http://127.0.0.1:8787 http://localhost:8787 data: blob:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadow Pet</title>
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <div class="pet-shell avatar-streamer" id="petShell" data-state="idle">
      <div class="aura"></div>
      <div class="watch-dot" id="watchDot" title="持续陪伴状态"></div>
      <div class="pet-bubble" id="petBubble">右键开启持续陪伴，双击也可以切换。</div>

      <!-- State expression overlays -->
      <div class="state-fx" aria-hidden="true">
        <div class="thought">
          <span class="t-dot d1"></span>
          <span class="t-dot d2"></span>
          <span class="t-dot d3"></span>
        </div>
        <div class="sweat"></div>
        <div class="sparkle s1"></div>
        <div class="sparkle s2"></div>
        <div class="sparkle s3"></div>
        <div class="sparkle s4"></div>
        <div class="sound-waves">
          <span></span><span></span><span></span>
        </div>
        <div class="heart h1"></div>
        <div class="heart h2"></div>
      </div>

      <!-- Image avatar — pointer-events:none so the shell receives clicks -->
      <div class="avatar" id="petBody" aria-label="Shadow digital companion" style="pointer-events:none;">
        <img
          class="avatar-standee"
          id="avatarImage"
          src="./assets/avatars/shadow-streamer.png"
          alt=""
          draggable="false"
        />
      </div>
    </div>
    <script type="module" src="./pet.js"></script>
  </body>
</html>
