# =============================================================================
# Hoshino — local vLLM override
# =============================================================================
# Use alongside docker-compose.yml to route LLM traffic to a local vLLM server.
# Requires a Linux host with GPU and vLLM already running on port 8000.
#
#   docker compose -f docker-compose.yml -f docker-compose.vllm.yml up
# =============================================================================

services:
  agent:
    environment:
      - PROVIDER=vllm
      - MODEL=Qwen/Qwen2.5-14B-Instruct
      - API_BASE=http://host.docker.internal:8000/v1
      - API_KEY=EMPTY
      - EMBEDDING_PROVIDER=hash
      - ENABLE_PROMPT_CACHE=false
