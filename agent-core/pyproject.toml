[project]
name = "bishoujo-agent-core"
version = "0.1.0"
description = "A desktop-pet multi-agent core with GUI automation, memory, and tool calling."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.20",
  "pyautogui>=0.9.54",
  "mss>=9.0.1",
  "pillow>=10.4.0",
  "pyyaml>=6.0",
  "chromadb>=0.4.0",
  "edge-tts>=7.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
