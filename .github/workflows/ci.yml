name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Unit + Eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-core

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio ruff chromadb

      - name: Lint
        run: ruff check app/

      - name: Unit tests
        run: pytest tests/ -q

      - name: Intent routing eval
        run: python -m eval.run_intent_eval --min-accuracy 0.80

      - name: Collaboration eval
        run: python -m eval.run_collaboration_eval --offline
